services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-text-analyzer-ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-3h}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Télécharge le modèle une seule fois (persisté dans le volume), puis s'arrête
  ollama-init:
    image: ollama/ollama:latest
    container_name: ai-text-analyzer-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${DEFAULT_MODEL:-llama3.2:1b}"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-text-analyzer-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - OLLAMA_URL=http://ollama:11434/v1
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=ollama
      - DEFAULT_MODEL=${DEFAULT_MODEL:-llama3.2:1b}
      - PORT=3000
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-text-analyzer-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
